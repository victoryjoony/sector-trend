name: daily-update

on:
  schedule:
    # 미국 장 마감 뒤 한국 아침 (화~토 07:00, 07:40 KST). 두 번째는 GitHub 예약 누락 대비용
    - cron: "0 22 * * 1-5"
    - cron: "40 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
